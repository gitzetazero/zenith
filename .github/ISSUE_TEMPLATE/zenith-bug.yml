name: Bug
description: Something does not work in Zenith or its launcher
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Security problems: do not use this form**, read `SECURITY.md`.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to repeat it
      placeholder: "1. ...\n2. ..."
  - type: input
    id: version
    attributes:
      label: Zenith version (nightly)
      placeholder: "Nightly 2026-11-05"
  - type: input
    id: server
    attributes:
      label: If it was on a server, its version (not its address if it is private)
      placeholder: "1.21.4"
  - type: textarea
    id: extra
    attributes:
      label: Windows, graphics card and log
      description: "Paste the bridge log (%APPDATA%\zenith\logs\bridge.log) here if it helps. Remove your personal data."
