name: Fallo
description: Algo no funciona en Zenith o en su launcher
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por avisar. **Fallos de seguridad: no uses este formulario**, lee `SECURITY.md`.
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué pasó
      description: Qué esperabas y qué ocurrió en su lugar.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Cómo repetirlo
      placeholder: "1. ...\n2. ..."
  - type: input
    id: version
    attributes:
      label: Versión de Zenith (nightly)
      placeholder: "Nightly 2026-11-05"
  - type: input
    id: servidor
    attributes:
      label: Si fue en un servidor, su versión (no su dirección si es privado)
      placeholder: "1.21.4"
  - type: textarea
    id: extra
    attributes:
      label: Windows, tarjeta gráfica y registro
      description: "Pega aquí el registro del puente (%APPDATA%\\zenith\\logs\\bridge.log) si ayuda. Quita tus datos personales."
