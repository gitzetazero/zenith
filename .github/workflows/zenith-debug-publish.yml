name: zenith-debug-publish
# Temporary: finds which release API call the workflow token is refused (HTTP 403). Deleted once understood.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: probe
        run: |
          set +e
          # read-only apart from a no-op: each tag is "updated" to the sha it already has, without force
          for t in nightly nightly-2026-11-05 nightly-2026-11-06; do
            sha=$(gh api "repos/$REPO/git/ref/tags/$t" --jq .object.sha)
            echo "--- $t at $sha"
            gh api -X PATCH "repos/$REPO/git/refs/tags/$t" -f sha="$sha" -F force=false --jq .ref 2>&1 | head -2
          done
