name: zenith-sync

# Keeps Zenith's main level with horizon-rust/horizon main: every hour it merges Horizon's tip into main with a real
# merge commit (never a rebase, never a force push to main), so every commit of ours stays. All the logic is in
# zenith/ci/sync.py (runnable locally: `python zenith/ci/sync.py merge --upstream-ref upstream/main`).
#
#   merge     prune.py removes what Zenith never uses, merge=ours keeps our README/CONTRIBUTING, Cargo.toml/Cargo.lock
#             take Horizon's and are pruned/regenerated; any other conflict blocks the sync.
#   checks    check_zenith_intact.py (nothing of ours was dropped), unit tests, links, public tree, fmt, clippy,
#             protocol tests, bridge fmt/clippy/tests, client build, launch API.
#   blocked   (conflict or failed check) main is NOT touched: the attempt goes to branch sync/<date>-<short>, a PR
#             and ONE issue labelled `sync`; the run ends red. main then stays behind until someone resolves it.
#   release   after a merge (or when already level), zenith-release is dispatched only if the merged Horizon commit
#             is covered by the newest Horizon nightly (its exporters must match the code); otherwise the job
#             summary says "release pending".
#
# Uses secrets.ZENITH_SYNC_TOKEN (contents + workflows on gitzetazero/zenith): GITHUB_TOKEN cannot push merges that
# touch .github/workflows nor trigger other workflows. The token is given only to the steps that push, open
# PRs/issues or dispatch; the steps that run merged upstream code (cargo build/test/clippy, build.rs, proc macros)
# never see it, and checkout does not keep it in .git/config.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: zenith-sync
  cancel-in-progress: false

env:
  # the extra `upstream` remote would otherwise make gh resolve horizon-rust/horizon
  GH_REPO: ${{ github.repository }}

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch Horizon main
        run: |
          git remote add upstream https://github.com/horizon-rust/horizon.git
          git fetch upstream main --no-tags --quiet
          # Only Horizon's permanent nightly-source/* tags: its other tags (`nightly`...) clash with ours and would
          # make a plain `--tags` fetch fail ("would clobber existing tag").
          git fetch upstream 'refs/tags/nightly-source/*:refs/tags/nightly-source/*' --quiet

      - name: Merge Horizon main
        id: merge
        run: python3 zenith/ci/sync.py merge --upstream-ref upstream/main --output "$GITHUB_OUTPUT" || [ $? -eq 10 ]

      - name: Report a blocked merge
        if: steps.merge.outputs.outcome == 'blocked'
        env:
          GH_TOKEN: ${{ secrets.ZENITH_SYNC_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ steps.merge.outputs.upstream }}
          REASON: ${{ steps.merge.outputs.reason }}
          COMMIT: ${{ steps.merge.outputs.commit }}
          DETAILS: ${{ steps.merge.outputs.conflicts }}
        run: |
          python3 zenith/ci/sync.py report --reason "$REASON" --commit "$COMMIT" --conflicts "$DETAILS"
          exit 1

      - name: Install system deps
        if: steps.merge.outputs.outcome == 'merged'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: steps.merge.outputs.outcome == 'merged'
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: steps.merge.outputs.outcome == 'merged'

      - name: Check the merged tree
        id: check
        if: steps.merge.outputs.outcome == 'merged'
        run: python3 zenith/ci/sync.py checks | tee "$RUNNER_TEMP/checks.log"; grep '^failed=' "$RUNNER_TEMP/checks.log" >> "$GITHUB_OUTPUT"

      - name: Report a failed check
        if: steps.merge.outputs.outcome == 'merged' && steps.check.outputs.failed != ''
        env:
          GH_TOKEN: ${{ secrets.ZENITH_SYNC_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ steps.merge.outputs.upstream }}
          COMMIT: ${{ steps.merge.outputs.commit }}
          FAILED: ${{ steps.check.outputs.failed }}
        run: |
          python3 zenith/ci/sync.py report --reason "failed check: $FAILED" --commit "$COMMIT"
          exit 1

      - name: Push main
        id: push
        if: steps.merge.outputs.outcome == 'merged' && steps.check.outputs.failed == ''
        env:
          GH_TOKEN: ${{ secrets.ZENITH_SYNC_TOKEN }}
        run: |
          # A normal fast-forward push of the merge commit. If main moved meanwhile it is rejected and the next
          # hourly run starts again from the new main (nothing is forced).
          if git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::main moved while the sync ran; the next run retries"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Close the sync issue
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.ZENITH_SYNC_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 zenith/ci/sync.py resolved

      # zenith-release.yml requires `date` to be today's UTC date. Only a Horizon commit covered by a Horizon
      # nightly may be published (the exporters come from that nightly); the sync.py release step decides.
      - name: Release if the merged Horizon commit is covered by a nightly
        if: (steps.merge.outputs.outcome == 'up-to-date' || steps.push.outputs.pushed == 'true') && vars.ZENITH_AUTOPUBLISH != 'off'
        env:
          GH_TOKEN: ${{ secrets.ZENITH_SYNC_TOKEN }}
          UPSTREAM: ${{ steps.merge.outputs.upstream }}
        run: python3 zenith/ci/sync.py release --upstream "$UPSTREAM" | tee -a "$GITHUB_STEP_SUMMARY"
