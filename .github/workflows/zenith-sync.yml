name: zenith-sync

# Uses secrets.ZENITH_SYNC_TOKEN (contents + workflows on gitzetazero/zenith):
# GITHUB_TOKEN cannot push merges that touch .github/workflows nor trigger other workflows.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency: zenith-sync

env:
  # the extra `upstream` remote would otherwise make gh resolve horizon-rust/horizon
  GH_REPO: ${{ github.repository }}

# The sync PAT is given only to the steps that push, open PRs, dispatch or disable workflows. The steps that run
# the merged upstream code (cargo build/test/clippy, build.rs, proc macros) never see it, and checkout does not
# keep it in .git/config.
jobs:
  sync:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Pick nightly
        id: pick
        run: |
          git remote add upstream https://github.com/horizon-rust/horizon.git
          git fetch upstream main --tags
          pick=$(python3 zenith/ci/pick_nightly.py --ref upstream/main)
          echo "pick=$pick"
          if [ "$pick" = "null" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          tag=$(jq -r .tag <<<"$pick")
          if git merge-base --is-ancestor "$tag" HEAD; then
            echo "already merged: $tag"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          {
            echo "skip=false"
            echo "tag=$tag"
            echo "release=$(jq -r .release <<<"$pick")"
            echo "date=$(jq -r .date <<<"$pick")"
            echo "short=$(jq -r .short <<<"$pick")"
          } >> "$GITHUB_OUTPUT"

      # README.md merge=ours (.gitattributes) only works if the driver exists: `true` keeps our side without a conflict
      - name: Enable merge=ours driver
        run: git config merge.ours.driver true

      - name: Merge nightly source
        id: merge
        if: steps.pick.outputs.skip == 'false'
        env:
          TAG: ${{ steps.pick.outputs.tag }}
        run: |
          git config user.name zenith-sync
          git config user.email zenith-sync@users.noreply.github.com
          if ! git merge --no-edit "$TAG"; then
            git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt"
            git merge --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report merge conflicts
        if: steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.ZENITH_SYNC_TOKEN }}
          TAG: ${{ steps.pick.outputs.tag }}
          BRANCH: sync/${{ steps.pick.outputs.date }}-${{ steps.pick.outputs.short }}
        run: |
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$TAG^{commit}:refs/heads/$BRANCH"
          printf 'Automatic merge of %s conflicts in:\n\n%s\n' "$TAG" "$(cat "$RUNNER_TEMP/conflicts.txt")" > "$RUNNER_TEMP/body.md"
          gh pr create --base main --head "$BRANCH" --title "sync: $TAG (conflicts)" --body-file "$RUNNER_TEMP/body.md"
          exit 1

      - name: Check merged tree
        id: check
        if: steps.pick.outputs.skip == 'false' && steps.merge.outputs.conflict != 'true'
        run: |
          # Zenith is client-only: the dedicated server and bot benchmark are not built or tested
          step=""
          python3 tools/check_public_tree.py || step="check_public_tree"
          [ -n "$step" ] || cargo fmt --all --check || step="cargo fmt"
          [ -n "$step" ] || cargo clippy --workspace --exclude horizon-server --exclude horizon-bots --all-targets --locked -- -D warnings || step="cargo clippy"
          [ -n "$step" ] || cargo test --workspace --exclude horizon-server --exclude horizon-bots --locked || step="cargo test"
          [ -n "$step" ] || cargo fmt --manifest-path zenith/bridge/Cargo.toml --check || step="bridge cargo fmt"
          [ -n "$step" ] || cargo clippy --manifest-path zenith/bridge/Cargo.toml --all-targets --locked -- -D warnings || step="bridge cargo clippy"
          [ -n "$step" ] || cargo test --manifest-path zenith/bridge/Cargo.toml --locked || step="bridge cargo test"
          [ -n "$step" ] || cargo build -p horizon-client --locked || step="cargo build client"
          [ -n "$step" ] || python3 zenith/ci/check_launch_api.py target/debug/horizon-client || step="launch API check"
          echo "failed=$step" >> "$GITHUB_OUTPUT"

      - name: Report a failed check
        if: steps.check.outputs.failed != ''
        env:
          GH_TOKEN: ${{ secrets.ZENITH_SYNC_TOKEN }}
          TAG: ${{ steps.pick.outputs.tag }}
          FAILED: ${{ steps.check.outputs.failed }}
          BRANCH: sync/${{ steps.pick.outputs.date }}-${{ steps.pick.outputs.short }}
        run: |
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "sync: $TAG (failed: $FAILED)" --body "Merging $TAG into main failed the step: $FAILED."
          exit 1

      - name: Push main
        if: steps.pick.outputs.skip == 'false' && steps.check.outputs.failed == ''
        env:
          GH_TOKEN: ${{ secrets.ZENITH_SYNC_TOKEN }}
        run: git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main

      - name: Disable non-zenith workflows
        if: steps.pick.outputs.skip == 'false' && steps.check.outputs.failed == ''
        env:
          GH_TOKEN: ${{ secrets.ZENITH_SYNC_TOKEN }}
        run: |
          # New Horizon workflows arrive active; 403 "not active" (seen on the fork) is tolerated.
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows" --paginate             --jq '.workflows[] | select(.state=="active") | select(.path | startswith(".github/workflows/zenith-") | not) | .id' |
          while read -r id; do
            gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$id/disable" || echo "could not disable $id (tolerated)"
          done

      # zenith-release.yml requires `date` to be today's UTC date, not the upstream nightly's.
      - name: Trigger release
        if: steps.pick.outputs.skip == 'false' && steps.check.outputs.failed == '' && vars.ZENITH_AUTOPUBLISH != 'off'
        env:
          GH_TOKEN: ${{ secrets.ZENITH_SYNC_TOKEN }}
          RELEASE: ${{ steps.pick.outputs.release }}
        run: gh workflow run zenith-release.yml -f release="$RELEASE" -f date="$(date -u +%F)"
