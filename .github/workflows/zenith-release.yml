name: zenith-release
run-name: zenith-release ${{ inputs.date }}
# Zenith's signed Nightly: builds this fork's main, signs the checksums for the `nightly` channel and publishes
# nightly-<date> plus the moving `nightly` Release. Modelled on Horizon's nightly-build.yml / game-build.yml.
# The exporters (our own classes only, no Mojang code) are taken from a Horizon Release instead of compiled here.
# Not affiliated with Mojang or Microsoft. Set the repository variable ZENITH_AUTOPUBLISH to `off` to stop it.
#
# Publish ordering (the old `nightly` is never deleted, so launchers always find a release):
#   1. a DRAFT nightly-<date> gets all four files; its file list is checked (a leftover draft or an unfinished
#      dated release from an earlier attempt is removed first);
#   2. `nightly` is updated in place: the archives, then SHA256SUMS, then SHA256SUMS.sig LAST, so during that short
#      window a launcher finds sums that do not match the signature or the archives and fails closed; then its
#      tag moves to this commit and its title changes; its assets are downloaded and verified again;
#   3. only then is nightly-<date> published. Its existence means "done", so the gate lets a retry through while
#      it is missing or `nightly` is older than the date.
on:
  workflow_dispatch:
    inputs:
      release:
        description: The Horizon Release whose exporters/ are reused
        type: string
        default: nightly
      date:
        description: Today's date (UTC, yyyy-mm-dd)
        type: string
        required: true
      force:
        description: Publish again although nightly-<date> is done (main only)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: zenith-release
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      go: ${{ steps.gate.outputs.go }}
      short: ${{ steps.gate.outputs.short }}
    steps:
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          DATE: ${{ inputs.date }}
          RELEASE: ${{ inputs.release }}
          FORCE: ${{ inputs.force }}
          AUTOPUBLISH: ${{ vars.ZENITH_AUTOPUBLISH }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$REF" == refs/heads/main ]] || { echo "::error::only main may build, sign and publish (this is $REF)"; exit 1; }
          [[ "$DATE" == "$(date -u +%F)" ]] || { echo "::error::date must be today's UTC date ($(date -u +%F))"; exit 1; }
          [[ "$RELEASE" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || { echo "::error::bad release name"; exit 1; }
          echo "short=${SHA:0:7}" >> "$GITHUB_OUTPUT"
          if [[ "$AUTOPUBLISH" == off ]]; then
            echo "ZENITH_AUTOPUBLISH is off: nothing built."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Done = the dated release is published (it goes out last) AND `nightly` is at least as new as the date.
          # A lookup that fails counts as "not done": the worst case is one more build.
          done_date=no
          if gh release view "nightly-$DATE" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            title=$(gh release view nightly -R "$GITHUB_REPOSITORY" --json name --jq .name 2>/dev/null || true)
            current=$(grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' <<< "$title" | head -1 || true)
            if [[ -n "$current" && ! "$current" < "$DATE" ]]; then done_date=yes; fi
          fi
          if [[ "$done_date" == yes && "$FORCE" != true ]]; then
            echo "nightly-$DATE is already published and nightly is current: at most one a day."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"

  exporters:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Exporters from the Horizon Release, signature checked (our own classes only)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          dl="$RUNNER_TEMP/horizon-dl"
          mkdir -p "$dl"
          # Every file Horizon's SHA256SUMS lists, plus SHA256SUMS and its signature. The key file in this repo is
          # Horizon's (release-keys.txt); the signed message names the release's own tag, as launchers check it.
          gh release download "$RELEASE" -R horizon-rust/horizon -D "$dl"
          cargo run --locked --quiet -p horizon-release-sign -- verify --tag "$RELEASE" \
            --key "$(cat crates/horizon-release-sign/release-keys.txt)" "$dl"
          awk '{ sub(/^\*/, "", $2); print $2 }' "$dl/SHA256SUMS" | grep -qx 'horizon-linux-x86_64.tar.gz' \
            || { echo "::error::the signed sums do not list horizon-linux-x86_64.tar.gz"; exit 1; }
          gzip -dc < "$dl/horizon-linux-x86_64.tar.gz" | tar x --strip-components=1 horizon-linux-x86_64/exporters
          test -f exporters/manifest.json
          odd=$(find exporters ! -type d ! -type f)
          [ -z "$odd" ] || { echo "::error::not a plain file (symlink?): $odd"; exit 1; }
          stray=$(find exporters ! -type d ! -path exporters/manifest.json \
            ! \( -name '*.class' \( -path 'exporters/server/dev/horizonlab/parity/*' -o -path 'exporters/client/dev/horizonlab/parity/*' \) \))
          [ -z "$stray" ] || { echo "::error::not one of our classes: $stray"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: exporters
          path: exporters/
          if-no-files-found: error
          retention-days: 3

  build:
    needs: [gate, exporters]
    if: needs.gate.outputs.go == 'true'
    name: build ${{ matrix.name }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            dir: horizon-linux-x86_64
            asset: horizon-linux-x86_64.tar.gz
          - name: windows
            os: windows-latest
            dir: horizon-windows-x64
            asset: horizon-windows-x64.zip
            exe: .exe
            rustflags: -C target-feature=+crt-static
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      HORIZON_VERSION: nightly-${{ inputs.date }}
      HORIZON_NIGHTLY: ${{ inputs.date }} ${{ needs.gate.outputs.short }}
      BIN: target/release
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: zenith-${{ matrix.name }}
      - name: ALSA and udev headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
      - uses: actions/download-artifact@v8
        with:
          name: exporters
          path: exporters
      - name: Build the client, horizon-ctl and horizon-prepare (no dedicated server)
        run: cargo build --release --locked -p horizon-client -p horizon-client-lib --bin horizon-client --bin horizon-ctl -p horizon-prepare --bin horizon-prepare
      - name: Package
        run: |
          set -euo pipefail
          cargo run --locked -p xtask -- package "$BIN/horizon-client${{ matrix.exe }}" "dist/${{ matrix.dir }}"
          cd dist
          rm -f "${{ matrix.asset }}"
          case "${{ matrix.asset }}" in
            *.tar.gz) tar czf "${{ matrix.asset }}" "${{ matrix.dir }}" ;;
            *) 7z a -tzip "${{ matrix.asset }}" "${{ matrix.dir }}" > /dev/null ;;
          esac
          ls -l "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 3

  sign:
    needs: [gate, build]
    if: needs.gate.outputs.go == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      # Nothing from the repository but the signing script, which only hashes and signs the archives.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: tools/ci/sign_release.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: horizon-*
          merge-multiple: true
      - name: Sign the checksums for the nightly channel
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: bash tools/ci/sign_release.sh nightly dist/horizon-linux-x86_64.tar.gz dist/horizon-windows-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: signature
          path: dist/SHA256SUMS*
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [gate, build, sign]
    if: needs.gate.outputs.go == 'true' && github.ref == 'refs/heads/main' && vars.ZENITH_AUTOPUBLISH != 'off'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: '{horizon-*,signature}'
          merge-multiple: true
      - name: The signature, checked as the bridge checks it
        run: cargo run --locked --quiet -p horizon-release-sign -- verify --tag nightly --key "$(tr -d '\r\n' < zenith/bridge/zenith-release-keys.txt)" dist
      - name: Publish (ordering in the header)
        env:
          GH_TOKEN: ${{ github.token }}
          DATE: ${{ inputs.date }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          repo=$GITHUB_REPOSITORY
          dated="nightly-$DATE"
          title="Nightly $DATE · ${SHA:0:7}"
          want="SHA256SUMS SHA256SUMS.sig horizon-linux-x86_64.tar.gz horizon-windows-x64.zip"
          {
            echo "Zenith build of commit ${SHA:0:7}, signed for the nightly channel (SHA256SUMS, SHA256SUMS.sig)."
            echo
            echo "Zenith is an independent project. It is not affiliated with, endorsed by or sponsored by Mojang or Microsoft; Minecraft is their trademark. No Minecraft code or assets are included: the game files come from your own copy."
            echo
            echo "Built on [Horizon](https://github.com/horizon-rust/horizon)."
          } > notes.md
          archives=(dist/horizon-windows-x64.zip dist/horizon-linux-x86_64.tar.gz)
          # The id of the release (draft or not) with this tag, empty if none.
          release_id() { gh api --paginate "repos/$repo/releases" --jq ".[] | select(.tag_name == \"$1\") | .id" | sed -n 1p; }
          assets_of() { gh api "repos/$repo/releases/$1" --jq '[.assets[].name] | sort | join(" ")'; }

          # 1. The dated release as a draft: an earlier attempt's leftover (draft or published) goes first.
          old=$(release_id "$dated")
          if [[ -n "$old" ]]; then
            gh api -X DELETE "repos/$repo/releases/$old"
            if gh api "repos/$repo/git/ref/tags/$dated" > /dev/null 2>&1; then
              gh api -X DELETE "repos/$repo/git/refs/tags/$dated"
            fi
          fi
          gh release create "$dated" --draft --prerelease --target "$SHA" --title "$title" --notes-file notes.md \
            "${archives[@]}" dist/SHA256SUMS dist/SHA256SUMS.sig
          id=$(release_id "$dated")
          [[ "$(assets_of "$id")" == "$want" ]] || { echo "::error::the draft's files are not the expected four"; exit 1; }

          # 2. `nightly` updated in place: archives, SHA256SUMS, then SHA256SUMS.sig last.
          if [[ -n "$(release_id nightly)" ]]; then
            gh release upload nightly --clobber -R "$repo" "${archives[@]}"
            gh release upload nightly --clobber -R "$repo" dist/SHA256SUMS
            gh release upload nightly --clobber -R "$repo" dist/SHA256SUMS.sig
            gh api -X PATCH "repos/$repo/git/refs/tags/nightly" -f sha="$SHA" -F force=true > /dev/null
            gh release edit nightly -R "$repo" --title "$title" --notes-file notes.md --prerelease --latest=false
          else
            gh release create nightly --prerelease --latest=false --target "$SHA" --title "$title" --notes-file notes.md \
              "${archives[@]}" dist/SHA256SUMS dist/SHA256SUMS.sig
          fi
          [[ "$(assets_of "$(release_id nightly)")" == "$want" ]] || { echo "::error::nightly does not hold exactly the expected four files"; exit 1; }
          rm -rf check && mkdir check
          gh release download nightly -R "$repo" -D check
          cargo run --locked --quiet -p horizon-release-sign -- verify --tag nightly --key "$(tr -d '\r\n' < zenith/bridge/zenith-release-keys.txt)" check

          # 3. Last: the dated release goes public. Its existence means everything above finished.
          gh api -X PATCH "repos/$repo/releases/$id" -F draft=false -f make_latest=false > /dev/null
