name: zenith-release
run-name: zenith-release ${{ inputs.date }}
# Zenith's signed Nightly: builds this fork's main, signs the checksums for the `nightly` channel and publishes
# nightly-<date> plus the moving `nightly` Release. Modelled on Horizon's nightly-build.yml / game-build.yml.
# The exporters (our own classes only, no Mojang code) are taken from a Horizon Release instead of compiled here.
# Not affiliated with Mojang or Microsoft. Set the repository variable ZENITH_AUTOPUBLISH to `off` to stop it.
#
# Publish ordering (the old `nightly` is never deleted, so launchers always find a release):
#   1. a DRAFT nightly-<date> gets all eight files (the two game archives, the bridge exe, the build stamp, the
#      launcher installer and portable zip, SHA256SUMS and its signature); its file list is checked (a leftover draft or an unfinished dated release from an earlier
#      attempt is removed first);
#   2. `nightly` is updated in place: the six signed files, then SHA256SUMS, then SHA256SUMS.sig LAST, so during that short
#      window a launcher finds sums that do not match the signature or the archives and fails closed; then its
#      tag moves to this commit and its title changes; its assets are downloaded and verified again;
#   3. only then is nightly-<date> published. Its existence means "done", so the gate lets a retry through while
#      it is missing or `nightly` is older than the date.
on:
  workflow_dispatch:
    inputs:
      release:
        description: The Horizon Release whose exporters/ are reused
        type: string
        default: nightly
      date:
        description: Today's date (UTC, yyyy-mm-dd)
        type: string
        required: true
      force:
        description: Publish again although nightly-<date> is done (main only)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: zenith-release
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      go: ${{ steps.gate.outputs.go }}
      short: ${{ steps.gate.outputs.short }}
    steps:
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          DATE: ${{ inputs.date }}
          RELEASE: ${{ inputs.release }}
          FORCE: ${{ inputs.force }}
          AUTOPUBLISH: ${{ vars.ZENITH_AUTOPUBLISH }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$REF" == refs/heads/main ]] || { echo "::error::only main may build, sign and publish (this is $REF)"; exit 1; }
          [[ "$DATE" == "$(date -u +%F)" ]] || { echo "::error::date must be today's UTC date ($(date -u +%F))"; exit 1; }
          [[ "$RELEASE" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || { echo "::error::bad release name"; exit 1; }
          echo "short=${SHA:0:7}" >> "$GITHUB_OUTPUT"
          if [[ "$AUTOPUBLISH" == off ]]; then
            echo "ZENITH_AUTOPUBLISH is off: nothing built."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Done = the dated release is published (it goes out last) AND `nightly` is at least as new as the date.
          # A lookup that fails counts as "not done": the worst case is one more build.
          done_date=no
          if gh release view "nightly-$DATE" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            title=$(gh release view nightly -R "$GITHUB_REPOSITORY" --json name --jq .name 2>/dev/null || true)
            current=$(grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' <<< "$title" | head -1 || true)
            if [[ -n "$current" && ! "$current" < "$DATE" ]]; then done_date=yes; fi
          fi
          if [[ "$done_date" == yes && "$FORCE" != true ]]; then
            echo "nightly-$DATE is already published and nightly is current: at most one a day."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"

  exporters:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Exporters from the Horizon Release, signature checked (our own classes only)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          dl="$RUNNER_TEMP/horizon-dl"
          mkdir -p "$dl"
          # Every file Horizon's SHA256SUMS lists, plus SHA256SUMS and its signature. The key file in this repo is
          # Horizon's (release-keys.txt); the signed message names the release's own tag, as launchers check it.
          gh release download "$RELEASE" -R horizon-rust/horizon -D "$dl"
          cargo run --locked --quiet -p horizon-release-sign -- verify --tag "$RELEASE" \
            --key "$(cat crates/horizon-release-sign/release-keys.txt)" "$dl"
          awk '{ sub(/^\*/, "", $2); print $2 }' "$dl/SHA256SUMS" | grep -qx 'horizon-linux-x86_64.tar.gz' \
            || { echo "::error::the signed sums do not list horizon-linux-x86_64.tar.gz"; exit 1; }
          gzip -dc < "$dl/horizon-linux-x86_64.tar.gz" | tar x --strip-components=1 horizon-linux-x86_64/exporters
          test -f exporters/manifest.json
          odd=$(find exporters ! -type d ! -type f)
          [ -z "$odd" ] || { echo "::error::not a plain file (symlink?): $odd"; exit 1; }
          stray=$(find exporters ! -type d ! -path exporters/manifest.json \
            ! \( -name '*.class' \( -path 'exporters/server/dev/horizonlab/parity/*' -o -path 'exporters/client/dev/horizonlab/parity/*' \) \))
          [ -z "$stray" ] || { echo "::error::not one of our classes: $stray"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: exporters
          path: exporters/
          if-no-files-found: error
          retention-days: 3

  build:
    needs: [gate, exporters]
    if: needs.gate.outputs.go == 'true'
    name: build ${{ matrix.name }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            dir: horizon-linux-x86_64
            asset: horizon-linux-x86_64.tar.gz
          - name: windows
            os: windows-latest
            dir: horizon-windows-x64
            asset: horizon-windows-x64.zip
            exe: .exe
            rustflags: -C target-feature=+crt-static
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      HORIZON_VERSION: nightly-${{ inputs.date }}
      HORIZON_NIGHTLY: ${{ inputs.date }} ${{ needs.gate.outputs.short }}
      BIN: target/release
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: zenith-${{ matrix.name }}
      - name: ALSA and udev headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: exporters
          path: exporters
      - name: Build the client, horizon-ctl and horizon-prepare (no dedicated server)
        run: cargo build --release --locked -p horizon-client -p horizon-client-lib --bin horizon-client --bin horizon-ctl -p horizon-prepare --bin horizon-prepare
      - name: Package
        run: |
          set -euo pipefail
          cargo run --locked -p xtask -- package "$BIN/horizon-client${{ matrix.exe }}" "dist/${{ matrix.dir }}"
          cd dist
          rm -f "${{ matrix.asset }}"
          case "${{ matrix.asset }}" in
            *.tar.gz) tar czf "${{ matrix.asset }}" "${{ matrix.dir }}" ;;
            *) 7z a -tzip "${{ matrix.asset }}" "${{ matrix.dir }}" > /dev/null ;;
          esac
          ls -l "${{ matrix.asset }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 3

  bridge:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: zenith/bridge
          shared-key: zenith-bridge
      - name: Build the bridge (its own workspace)
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path zenith/bridge/Cargo.toml
          mkdir -p dist
          cp zenith/bridge/target/release/zenith-bridge.exe dist/zenith-bridge-windows-x64.exe
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: zenith-bridge-windows-x64.exe
          path: dist/zenith-bridge-windows-x64.exe
          if-no-files-found: error
          retention-days: 3

  # Zenith Launcher: the installer and the portable zip bundle the UNMODIFIED official XMCL (pinned version and
  # SHA-256 in zenith/launcher-interim/xmcl-pin.txt, checked again by build.sh, fail closed) with the bridge built above.
  launcher:
    needs: [gate, bridge]
    if: needs.gate.outputs.go == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: zenith-bridge-windows-x64.exe
          path: dist
      - name: The pinned official XMCL release asset (never "latest")
        run: |
          set -euo pipefail
          pin() { sed -n "s/^$1=//p" zenith/launcher-interim/xmcl-pin.txt | tr -d '\015'; }
          mkdir -p "$RUNNER_TEMP/xmcl"
          curl --fail --location --silent --show-error --retry 3 -o "$RUNNER_TEMP/xmcl/$(pin asset)" "$(pin url)"
          ls -l "$RUNNER_TEMP/xmcl"
      - name: NSIS
        run: |
          set -euo pipefail
          if ! command -v makensis > /dev/null && [ ! -x "/c/Program Files (x86)/NSIS/makensis.exe" ]; then
            choco install nsis --version=3.11 --no-progress -y
          fi
      - name: Installer and portable zip
        env:
          DATE: ${{ inputs.date }}
          SHORT: ${{ needs.gate.outputs.short }}
        run: |
          set -euo pipefail
          export PATH="$PATH:/c/Program Files (x86)/NSIS"
          makensis -VERSION
          asset=$(sed -n 's/^asset=//p' zenith/launcher-interim/xmcl-pin.txt | tr -d '\015')
          mkdir -p out
          bash zenith/launcher-interim/build.sh "$RUNNER_TEMP/xmcl/$asset" dist/zenith-bridge-windows-x64.exe out "nightly-$DATE-$SHORT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Zenith-Launcher-Setup-x64.exe
          path: out/Zenith-Launcher-Setup-x64.exe
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Zenith-Launcher-Portable-x64.zip
          path: out/Zenith-Launcher-Portable-x64.zip
          if-no-files-found: error
          retention-days: 3

  # A release cannot be signed with a failing bridge: fmt, clippy and tests of zenith/bridge gate `sign`.
  bridge-tests:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: zenith/bridge
          shared-key: zenith-bridge-tests
      - name: fmt, clippy and tests of the bridge
        run: |
          set -euo pipefail
          cargo fmt --manifest-path zenith/bridge/Cargo.toml --check
          cargo clippy --manifest-path zenith/bridge/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path zenith/bridge/Cargo.toml --locked

  sign:
    needs: [gate, build, bridge, bridge-tests, launcher]
    if: needs.gate.outputs.go == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      # Nothing from the repository but the signing script, which only hashes and signs the archives.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: tools/ci/sign_release.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          pattern: '{horizon-*,zenith-bridge-*,Zenith-Launcher-*}'
          merge-multiple: true
      # The stamp tells launchers which commit this is and when it was built; being signed with the rest,
      # the bridge uses it to refuse a downgrade.
      - name: Build stamp
        env:
          SHA: ${{ github.sha }}
        run: printf 'commit=%s\nbuilt=%s\n' "$SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/zenith-build.txt
      - name: Sign the checksums for the nightly channel
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: >
          bash tools/ci/sign_release.sh nightly dist/horizon-linux-x86_64.tar.gz dist/horizon-windows-x64.zip
          dist/zenith-bridge-windows-x64.exe dist/zenith-build.txt dist/Zenith-Launcher-Setup-x64.exe
          dist/Zenith-Launcher-Portable-x64.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signature
          path: |
            dist/SHA256SUMS*
            dist/zenith-build.txt
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [gate, build, sign]
    if: needs.gate.outputs.go == 'true' && github.ref == 'refs/heads/main' && vars.ZENITH_AUTOPUBLISH != 'off'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          pattern: '{horizon-*,zenith-bridge-*,Zenith-Launcher-*,signature}'
          merge-multiple: true
      - name: The signature, checked as the bridge checks it
        run: cargo run --locked --quiet -p horizon-release-sign -- verify --tag nightly --key "$(tr -d '\r\n' < zenith/bridge/zenith-release-keys.txt)" dist
      - name: Publish (zenith/ci/zenith_publish.sh, ordering in the header)
        env:
          GH_TOKEN: ${{ github.token }}
          DATE: ${{ inputs.date }}
          SHA: ${{ github.sha }}
        run: bash zenith/ci/zenith_publish.sh
