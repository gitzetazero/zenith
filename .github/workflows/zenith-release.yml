name: zenith-release
run-name: zenith-release ${{ inputs.date }}
# Zenith's signed Nightly: builds this fork's main, signs the checksums for the `nightly` channel and publishes
# nightly-<date> plus the moving `nightly` Release. Modelled on Horizon's nightly-build.yml / game-build.yml.
# The exporters (our own classes only, no Mojang code) are taken from a Horizon Release instead of compiled here.
# Not affiliated with Mojang or Microsoft. Set the repository variable ZENITH_AUTOPUBLISH to `off` to stop it.
on:
  workflow_dispatch:
    inputs:
      release:
        description: The Horizon Release whose exporters/ are reused
        type: string
        default: nightly
      date:
        description: Date of the build (UTC, yyyy-mm-dd)
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: zenith-release
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      go: ${{ steps.gate.outputs.go }}
      short: ${{ steps.gate.outputs.short }}
    steps:
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          DATE: ${{ inputs.date }}
          RELEASE: ${{ inputs.release }}
          AUTOPUBLISH: ${{ vars.ZENITH_AUTOPUBLISH }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::date must be yyyy-mm-dd"; exit 1; }
          [[ "$RELEASE" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::bad release name"; exit 1; }
          echo "short=${SHA:0:7}" >> "$GITHUB_OUTPUT"
          if [[ "$AUTOPUBLISH" == off ]]; then
            echo "ZENITH_AUTOPUBLISH is off: nothing built."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if gh release view "nightly-$DATE" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "nightly-$DATE already exists: at most one a day."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    name: build ${{ matrix.name }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            dir: horizon-linux-x86_64
            asset: horizon-linux-x86_64.tar.gz
          - name: windows
            os: windows-latest
            dir: horizon-windows-x64
            asset: horizon-windows-x64.zip
            exe: .exe
            rustflags: -C target-feature=+crt-static
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      HORIZON_VERSION: nightly-${{ inputs.date }}
      HORIZON_NIGHTLY: ${{ inputs.date }} ${{ needs.gate.outputs.short }}
      BIN: target/release
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: zenith-${{ matrix.name }}
      - name: ALSA and udev headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
      - name: Exporters from the Horizon Release (our own classes only)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/horizon-dl"
          gh release download "$RELEASE" -R horizon-rust/horizon -p 'horizon-linux-x86_64.tar.gz' -D "$RUNNER_TEMP/horizon-dl"
          tar xzf "$RUNNER_TEMP/horizon-dl/horizon-linux-x86_64.tar.gz" --strip-components=1 horizon-linux-x86_64/exporters
          test -f exporters/manifest.json
          stray=$(find exporters -type f ! -path exporters/manifest.json \
            ! \( -name '*.class' \( -path 'exporters/server/dev/horizonlab/parity/*' -o -path 'exporters/client/dev/horizonlab/parity/*' \) \))
          [ -z "$stray" ] || { echo "::error::not one of our classes: $stray"; exit 1; }
      - name: Build the client, horizon-ctl, horizon-prepare and horizon-server
        run: cargo build --release --locked -p horizon-client -p horizon-client-lib --bin horizon-client --bin horizon-ctl -p horizon-prepare --bin horizon-prepare -p horizon-server --bin horizon-server
      - name: Package
        run: |
          set -euo pipefail
          cargo run --locked -p xtask -- package "$BIN/horizon-client${{ matrix.exe }}" "dist/${{ matrix.dir }}"
          cd dist
          rm -f "${{ matrix.asset }}"
          case "${{ matrix.asset }}" in
            *.tar.gz) tar czf "${{ matrix.asset }}" "${{ matrix.dir }}" ;;
            *) 7z a -tzip "${{ matrix.asset }}" "${{ matrix.dir }}" > /dev/null ;;
          esac
          ls -l "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 3

  sign:
    needs: [gate, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      # Nothing from the repository but the signing script, which only hashes and signs the archives.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: tools/ci/sign_release.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: horizon-*
          merge-multiple: true
      - name: Sign the checksums for the nightly channel
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: bash tools/ci/sign_release.sh nightly dist/horizon-linux-x86_64.tar.gz dist/horizon-windows-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: signature
          path: dist/SHA256SUMS*
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [gate, build, sign]
    if: needs.gate.outputs.go == 'true' && vars.ZENITH_AUTOPUBLISH != 'off'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: The signature, checked as the bridge checks it
        run: cargo run --locked --quiet -p horizon-release-sign -- verify --tag nightly --key "$(tr -d '\r\n' < zenith/bridge/zenith-release-keys.txt)" dist
      - name: Publish nightly-<date> and move `nightly`
        env:
          GH_TOKEN: ${{ github.token }}
          DATE: ${{ inputs.date }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          title="Nightly $DATE · ${SHA:0:7}"
          {
            echo "Zenith build of commit ${SHA:0:7}, signed for the nightly channel (SHA256SUMS, SHA256SUMS.sig)."
            echo
            echo "Zenith is an independent project. It is not affiliated with, endorsed by or sponsored by Mojang or Microsoft; Minecraft is their trademark. No Minecraft code or assets are included: the game files come from your own copy."
            echo
            echo "Built on [Horizon](https://github.com/horizon-rust/horizon)."
          } > notes.md
          files=(dist/horizon-windows-x64.zip dist/horizon-linux-x86_64.tar.gz dist/SHA256SUMS dist/SHA256SUMS.sig)
          gh release create "nightly-$DATE" --prerelease --latest=false --target "$SHA" --title "$title" --notes-file notes.md "${files[@]}"
          gh release delete nightly --cleanup-tag --yes 2>/dev/null || true
          gh release create nightly --prerelease --latest=false --target "$SHA" --title "$title" --notes-file notes.md "${files[@]}"
