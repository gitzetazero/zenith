name: zenith-debug-release
on: workflow_dispatch
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          r=$GITHUB_REPOSITORY
          echo hi > f.txt; echo notes > n.md
          try() { echo "== $1"; shift; "$@" 2>&1 | cut -c1-200 | head -5 || true; }
          try "gh create draft prerelease" gh release create zdbg-6 --draft --prerelease --target $SHA --title dbg --notes-file n.md f.txt
          try "list" gh api repos/$r/releases --jq '.[]|[.id,.tag_name,.draft]|join(" ")'
          for id in $(gh api repos/$r/releases --jq '.[]|select(.tag_name|startswith("zdbg-"))|.id'); do gh api -X DELETE repos/$r/releases/$id; done
          gh api repos/$r/releases --jq '.[]|[.id,.tag_name,.draft]|join(" ")'
