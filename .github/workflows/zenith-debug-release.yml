name: zenith-debug-release
# temporary: runs the publish step on the artifacts of an earlier run
on:
  workflow_dispatch:
    inputs:
      run_id:
        type: string
        required: true
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: '{horizon-*,signature}'
          merge-multiple: true
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - run: cargo run --locked --quiet -p horizon-release-sign -- verify --tag nightly --key "$(tr -d '\r\n' < zenith/bridge/zenith-release-keys.txt)" dist
      - env:
          GH_TOKEN: ${{ github.token }}
          DATE: ${{ github.event.repository.pushed_at && '2026-11-05' }}
          SHA: ${{ github.sha }}
        run: bash tools/ci/zenith_publish.sh
